# JM Comment: Bitbucket Pipelines CI/CD for Distributed AI Foundation Ray Architecture
# Implements safe manual approval gates (trigger: manual), segmented provisioning order,
# dynamic addon health checks (ACTIVE/DEGRADED), Metrics Server, Prometheus & Grafana monitoring,
# segregated EKS-level workload teardown before Terraform destroy, and RayJob orchestration.
# Per operational requirement: NO automatic pipelines on push/PR; ALL workflows run via manual custom triggers.

image: atlassian/default-image:4

options:
  docker: true
  size: 2x

definitions:
  services:
    docker:
      memory: 3072

  steps:
    # -------------------------------------------------------------------------
    # Unit Tests and Code Validation
    # -------------------------------------------------------------------------
    - step: &unit-tests
        name: "Run Pipeline Unit Tests"
        image: python:3.10-slim
        script:
          - python scripts/generate_datasets.py
          - python tests/test_ray_components.py

    # -------------------------------------------------------------------------
    # Docker Build and Push to AWS ECR
    # -------------------------------------------------------------------------
    - step: &build-and-push
        name: "Build and Push Container Image to ECR"
        services:
          - docker
        script:
          - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
          - export ECR_REGISTRY=${ECR_REGISTRY_URL:-"693880751318.dkr.ecr.us-east-1.amazonaws.com"}
          - export IMAGE_TAG="${BITBUCKET_COMMIT:0:8}"
          - echo "Installing AWS CLI..."
          - which aws >/dev/null 2>&1 || (curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip" && unzip -q awscliv2.zip && ./aws/install && rm -rf aws awscliv2.zip) || apt-get update && apt-get install -y awscli || true
          - echo "Authenticating with AWS ECR in $AWS_REGION for registry $ECR_REGISTRY..."
          - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
          - echo "Ensuring ECR repository distributed-ai-ray exists..."
          - aws ecr describe-repositories --repository-names distributed-ai-ray --region $AWS_REGION || aws ecr create-repository --repository-name distributed-ai-ray --region $AWS_REGION
          - echo "Building Docker image for $ECR_REGISTRY/distributed-ai-ray ($IMAGE_TAG and latest)..."
          - docker build -t $ECR_REGISTRY/distributed-ai-ray:$IMAGE_TAG -t $ECR_REGISTRY/distributed-ai-ray:latest .
          - echo "Pushing Docker images to AWS ECR..."
          - docker push $ECR_REGISTRY/distributed-ai-ray:$IMAGE_TAG
          - docker push $ECR_REGISTRY/distributed-ai-ray:latest
          - echo "=== [Verification] Auditing image existence and size in ECR ==="
          - |
            IMAGE_INFO=$(aws ecr describe-images --repository-name distributed-ai-ray --image-ids imageTag=$IMAGE_TAG --region $AWS_REGION --query "imageDetails[0]" --output json)
            if [ -z "$IMAGE_INFO" ] || [ "$IMAGE_INFO" == "null" ]; then
              echo "FATAL: Image tag $IMAGE_TAG verification failed in ECR repository distributed-ai-ray!"
              exit 1
            fi
            SIZE_BYTES=$(echo "$IMAGE_INFO" | grep -o '"imageSizeInBytes": [0-9]*' | awk '{print $2}')
            SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE_BYTES/1048576}")
            DIGEST=$(echo "$IMAGE_INFO" | grep -o '"imageDigest": "[^"]*"' | cut -d'"' -f4)
            echo "----------------------------------------------------------------"
            echo " [VERIFIED] Image successfully published to AWS ECR"
            echo " Repository  : distributed-ai-ray"
            echo " Tag         : $IMAGE_TAG (and latest)"
            echo " Image Digest: $DIGEST"
            echo " Image Size  : $SIZE_MB MB ($SIZE_BYTES bytes)"
            echo "----------------------------------------------------------------"

    # -------------------------------------------------------------------------
    # Dynamic Addon Health Check & Cluster Prerequisites
    # -------------------------------------------------------------------------
    - step: &check-prerequisites
        name: "Verify Addon Status & Deploy Prerequisites and Monitoring Stack"
        image: amazon/aws-cli:2.15.15
        script:
          - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          - chmod +x kubectl && mv kubectl /usr/local/bin/
          - export TARGET_CLUSTER=${EXISTING_EKS_CLUSTER_NAME:-${EKS_CLUSTER_NAME:-"distributed-ai-eks"}}
          - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
          - echo "Connecting to EKS Cluster $TARGET_CLUSTER in $AWS_REGION..."
          - aws eks update-kubeconfig --region $AWS_REGION --name $TARGET_CLUSTER || echo "Local cluster mode"
          - echo "=== [Audit] Checking EKS Managed Addon Statuses ==="
          - |
            check_addon() {
              local addon=$1
              STATUS=$(aws eks describe-addon --cluster-name $TARGET_CLUSTER --addon-name $addon --region $AWS_REGION --query "addon.status" --output text 2>/dev/null || echo "NOT_FOUND")
              echo "Add-on '$addon' current status: $STATUS"
              if [ "$STATUS" == "ACTIVE" ]; then
                echo "-> Add-on '$addon' is healthy and ACTIVE. Skipping."
              elif [ "$STATUS" == "DEGRADED" ]; then
                echo "-> Add-on '$addon' is DEGRADED. Resolving conflicts with OVERWRITE..."
                aws eks update-addon --cluster-name $TARGET_CLUSTER --addon-name $addon --resolve-conflicts OVERWRITE --region $AWS_REGION || true
              elif [ "$STATUS" == "NOT_FOUND" ]; then
                echo "-> Add-on '$addon' is not installed yet. Managed by Terraform layer."
              fi
            }
            check_addon "vpc-cni"
            check_addon "kube-proxy"
            check_addon "coredns"
            check_addon "aws-ebs-csi-driver"
            check_addon "eks-pod-identity-agent"
            check_addon "aws-secrets-store-csi-driver-provider"
            check_addon "metrics-server"
          - |
            kubectl patch svc metrics-server -n kube-system --type='json' -p='[{"op": "replace", "path": "/spec/selector", "value": {"app.kubernetes.io/name": "metrics-server", "app.kubernetes.io/instance": "metrics-server"}}]' || true
          - echo "Applying Gateway API CRDs..."
          - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.1.0/standard-install.yaml || true
          - echo "Applying KubeRay CRDs..."
          - kubectl apply -k "github.com/ray-project/kuberay/ray-operator/config/crd?ref=v1.1.1" || true
          - echo "Applying Secrets Store CSI Driver CRDs and Provider..."
          - kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/main/charts/secrets-store-csi-driver/crds/secrets-store.csi.x-k8s.io_secretproviderclasses.yaml || true
          - kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/main/charts/secrets-store-csi-driver/crds/secrets-store.csi.x-k8s.io_secretproviderclasspodstatuses.yaml || true
          - kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml || true
          - echo "Applying Namespaces, Secrets, IRSA, and Gateway API..."
          - kubectl apply -f k8s/00-namespace.yaml
          - kubectl apply -f k8s/01-secrets.yaml
          - kubectl apply -f k8s/02-irsa-serviceaccount.yaml
          - kubectl apply -f k8s/06-gateway-api.yaml
          - kubectl apply -f k8s/06-alb-ingress.yaml || true
          - echo "Applying Prometheus and Grafana Monitoring Stack..."
          - kubectl apply -f k8s/07-monitoring.yaml
          - echo "Prerequisites, Metrics Server, Prometheus & Grafana verified successfully."

    # -------------------------------------------------------------------------
    # Deploy RayCluster & RayJob CRD
    # -------------------------------------------------------------------------
    - step: &deploy-rayjob
        name: "Deploy RayJob CRD to EKS Cluster"
        image: amazon/aws-cli:2.15.15
        script:
          - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          - chmod +x kubectl && mv kubectl /usr/local/bin/
          - export TARGET_CLUSTER=${EXISTING_EKS_CLUSTER_NAME:-${EKS_CLUSTER_NAME:-"distributed-ai-eks"}}
          - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
          - aws eks update-kubeconfig --region $AWS_REGION --name $TARGET_CLUSTER || echo "Local cluster mode"
          - echo "Deploying Production RayCluster (Head + Spot Workers + Bottlerocket Resolver)..."
          - kubectl apply -f k8s/03-raycluster.yaml
          - echo "Cleaning up any previously completed RayJob to ensure clean run..."
          - kubectl delete rayjob corporate-data-pipeline-job -n kuberay --ignore-not-found=true
          - kubectl delete pod -l job-type=corporate-harmonization -n kuberay --ignore-not-found=true
          - echo "Deploying RayJob CRD (Ingest -> Resolve -> Iceberg -> Ray Train)..."
          - kubectl apply -f k8s/04-rayjob.yaml
          - echo "RayJob submitted successfully."
          - kubectl get rayjob -n kuberay || true

    # -------------------------------------------------------------------------
    # Clean Teardown of All Kubernetes Workloads & Cloud LoadBalancers
    # JM Comment: Executed BEFORE Terraform destroy to release AWS ENIs & ELBs
    # -------------------------------------------------------------------------
    - step: &teardown-k8s-workloads
        name: "Teardown EKS Workloads (Gateway LoadBalancers, Ray, Monitoring Stack)"
        image: amazon/aws-cli:2.15.15
        script:
          - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          - chmod +x kubectl && mv kubectl /usr/local/bin/
          - export TARGET_CLUSTER=${EXISTING_EKS_CLUSTER_NAME:-${EKS_CLUSTER_NAME:-"distributed-ai-eks"}}
          - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
          - echo "Connecting to EKS Cluster $TARGET_CLUSTER in $AWS_REGION..."
          - aws eks update-kubeconfig --region $AWS_REGION --name $TARGET_CLUSTER || echo "Cluster may already be unreachable or removed"
          - echo "=== [Stage 1 - Deleting Gateway API, HTTPRoutes & Cloud LoadBalancers to release AWS ENIs] ==="
          - kubectl delete ingress --all -A --ignore-not-found=true --timeout=30s || true
          - kubectl delete referencegrant --all -A --ignore-not-found=true --timeout=30s || true
          - kubectl delete httproute --all -A --ignore-not-found=true --timeout=30s || true
          - kubectl delete gateway --all -A --ignore-not-found=true --timeout=60s || true
          - kubectl delete gatewayclass --all --ignore-not-found=true --timeout=30s || true
          - echo "Checking and deleting any Service of type LoadBalancer across all namespaces..."
          - |
            kubectl get svc --all-namespaces -o jsonpath='{range .items[?(@.spec.type=="LoadBalancer")]}{.metadata.namespace}{" "}{.metadata.name}{"\n"}{end}' 2>/dev/null | while read ns svc; do
              if [ -n "$svc" ]; then
                echo "Deleting LoadBalancer service $svc in namespace $ns..."
                kubectl delete svc "$svc" -n "$ns" --timeout=60s || true
              fi
            done
          - echo "=== [Stage 2 - Deleting Prometheus & Grafana Monitoring Stack] ==="
          - kubectl delete -f k8s/07-monitoring.yaml --ignore-not-found=true --timeout=60s || true
          - kubectl delete namespace monitoring --ignore-not-found=true --timeout=60s || true
          - echo "=== [Stage 3 - Deleting RayJobs & RayClusters] ==="
          - kubectl delete rayjob --all -A --ignore-not-found=true --timeout=30s || true
          - kubectl delete raycluster --all -A --ignore-not-found=true --timeout=60s || true
          - kubectl patch rayjob corporate-data-pipeline-job -n kuberay -p '{"metadata":{"finalizers":[]}}' --type=merge 2>/dev/null || true
          - kubectl delete pod -l ray.io/node-type=worker -n kuberay --ignore-not-found=true || true
          - kubectl delete pod -l ray.io/node-type=head -n kuberay --ignore-not-found=true || true
          - echo "=== [Stage 4 - Deleting Remaining Kubernetes Resources & Namespaces] ==="
          - kubectl delete -f k8s/06-gateway-api.yaml --ignore-not-found=true --timeout=30s || true
          - kubectl delete -f k8s/04-rayjob.yaml --ignore-not-found=true --timeout=30s || true
          - kubectl delete -f k8s/03-raycluster.yaml --ignore-not-found=true --timeout=30s || true
          - kubectl delete -f k8s/02-irsa-serviceaccount.yaml --ignore-not-found=true --timeout=30s || true
          - kubectl delete -f k8s/01-secrets.yaml --ignore-not-found=true --timeout=30s || true
          - kubectl delete namespace kuberay --ignore-not-found=true --timeout=60s || true
          - echo "=== [Stage 5 - Cleaning up Glue Iceberg Catalog Tables] ==="
          - |
            echo "Checking tables in AWS Glue database corporate_iceberg_db..."
            TABLES=$(aws glue get-tables --database-name corporate_iceberg_db --region $AWS_REGION --query "TableList[].Name" --output text 2>/dev/null || true)
            for tbl in $TABLES; do
              if [ -n "$tbl" ] && [ "$tbl" != "None" ]; then
                echo "Deleting Glue catalog table: $tbl"
                aws glue delete-table --database-name corporate_iceberg_db --name "$tbl" --region $AWS_REGION || true
              fi
            done
          - echo "=== [Stage 6 - Purging S3 Data Lake Bucket Objects & Versions] ==="
          - |
            export TARGET_BUCKET=${ICEBERG_S3_BUCKET:-"distributed-ai-lake-d14ec094"}
            echo "Purging all objects and versions in s3://$TARGET_BUCKET..."
            aws s3 rm "s3://$TARGET_BUCKET" --recursive 2>/dev/null || true
            aws s3api list-object-versions --bucket "$TARGET_BUCKET" --region $AWS_REGION --query '{Objects: Versions[].{Key:Key,VersionId:VersionId}}' --output json > /tmp/versions.json 2>/dev/null || true
            if [ -s /tmp/versions.json ] && [ "$(cat /tmp/versions.json)" != '{"Objects": null}' ]; then
              aws s3api delete-objects --bucket "$TARGET_BUCKET" --delete file:///tmp/versions.json --region $AWS_REGION 2>/dev/null || true
            fi
            aws s3api list-object-versions --bucket "$TARGET_BUCKET" --region $AWS_REGION --query '{Objects: DeleteMarkers[].{Key:Key,VersionId:VersionId}}' --output json > /tmp/markers.json 2>/dev/null || true
            if [ -s /tmp/markers.json ] && [ "$(cat /tmp/markers.json)" != '{"Objects": null}' ]; then
              aws s3api delete-objects --bucket "$TARGET_BUCKET" --delete file:///tmp/markers.json --region $AWS_REGION 2>/dev/null || true
            fi
          - echo "Waiting 20 seconds for AWS Load Balancer Elastic Network Interfaces (ENIs) to cleanly detach..."
          - sleep 20
          - echo "Kubernetes in-cluster resources, Cloud LoadBalancers, Ray, Monitoring, and Data Lake staging cleaned up successfully."

pipelines:
  # ---------------------------------------------------------------------------
  # JM Comment: AUTOMATIC PIPELINES ARE DISABLED
  # No pipeline runs on commit, branch push, or pull-request.
  # ALL actions must be explicitly initiated via manual custom pipeline selection.
  # ---------------------------------------------------------------------------

  custom:
    # -------------------------------------------------------------------------
    # Custom Option 1: Safe Terraform Deployment (Plan -> Manual Approval -> Apply)
    # -------------------------------------------------------------------------
    1-terraform-deploy-infra:
      - step:
          name: "Plan: Preview All Infrastructure Changes"
          image: hashicorp/terraform:1.9.4
          script:
            - cd terraform/environments/prod
            - terraform init
            - export EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - echo "Syncing pre-existing EKS addons into Terraform state if present to avoid 409 ResourceInUseException..."
            - terraform import module.eks_addons.aws_eks_addon.coredns ${EKS_CLUSTER_NAME}:coredns || true
            - terraform import module.eks_addons.aws_eks_addon.aws_ebs_csi_driver ${EKS_CLUSTER_NAME}:aws-ebs-csi-driver || true
            - terraform import module.eks_addons.aws_eks_addon.aws_secrets_store_csi_driver_provider ${EKS_CLUSTER_NAME}:aws-secrets-store-csi-driver-provider || true
            - terraform import module.eks_addons.aws_eks_addon.metrics_server ${EKS_CLUSTER_NAME}:metrics-server || true
            - terraform plan -out=tfplan
          artifacts:
            - terraform/environments/prod/tfplan
      - step:
          name: "Apply: Deploy AWS Infrastructure (Manual Approval Required)"
          trigger: manual
          image: hashicorp/terraform:1.9.4
          script:
            - cd terraform/environments/prod
            - terraform init
            - export EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - echo "Ensuring existing addons are imported before apply..."
            - terraform import module.eks_addons.aws_eks_addon.coredns ${EKS_CLUSTER_NAME}:coredns || true
            - terraform import module.eks_addons.aws_eks_addon.aws_ebs_csi_driver ${EKS_CLUSTER_NAME}:aws-ebs-csi-driver || true
            - terraform import module.eks_addons.aws_eks_addon.aws_secrets_store_csi_driver_provider ${EKS_CLUSTER_NAME}:aws-secrets-store-csi-driver-provider || true
            - terraform import module.eks_addons.aws_eks_addon.metrics_server ${EKS_CLUSTER_NAME}:metrics-server || true
            - terraform apply tfplan
      - step:
          name: "Verify: Automated AWS Infrastructure Health Check"
          image: amazon/aws-cli:2.15.15
          script:
            - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
            - export CLUSTER=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - echo "Verifying created AWS resources in $AWS_REGION..."
            - aws eks describe-cluster --name $CLUSTER --region $AWS_REGION --query "cluster.status" || true
            - aws eks list-nodegroups --cluster-name $CLUSTER --region $AWS_REGION || true
            - echo "Verification completed."

    # -------------------------------------------------------------------------
    # Custom Option 2: Safe Segmented Teardown (EKS Workloads FIRST -> Terraform Destroy)
    # -------------------------------------------------------------------------
    2-terraform-destroy-infra:
      - step: *teardown-k8s-workloads
      - step:
          name: "Plan Teardown: Preview Resources to Destroy"
          image: hashicorp/terraform:1.9.4
          script:
            - cd terraform/environments/prod
            - terraform init
            - terraform plan -destroy
      - step:
          name: "Execute Teardown: Destroy AWS Infrastructure (Manual Approval Required)"
          trigger: manual
          image: hashicorp/terraform:1.9.4
          script:
            - cd terraform/environments/prod
            - terraform init
            - terraform destroy -auto-approve
      - step:
          name: "Audit: Verify Complete AWS Resource Deletion"
          image: amazon/aws-cli:2.15.15
          script:
            - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
            - export CLUSTER=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - echo "Running post-teardown deletion audit..."
            - aws eks describe-cluster --name $CLUSTER --region $AWS_REGION || echo "EKS Cluster successfully deleted."
            - aws ec2 describe-vpcs --filters "Name=tag:Name,Values=${CLUSTER}-vpc" --region $AWS_REGION --query "Vpcs[*].VpcId" --output text
            - echo "Deletion audit complete. Only Terraform-managed resources were destroyed."

    # -------------------------------------------------------------------------
    # Custom Option 3: Deploy RayJob Only (Build Image -> Deploy to EKS)
    # -------------------------------------------------------------------------
    3-deploy-rayjob-only:
      - step: *unit-tests
      - step: *build-and-push
      - step: *check-prerequisites
      - step: *deploy-rayjob

    # -------------------------------------------------------------------------
    # Custom Option 4: Deploy RayJob on Already Existing EKS Cluster
    # -------------------------------------------------------------------------
    4-deploy-rayjob-existing-cluster:
      - step:
          name: "Inspect Existing Cluster & Install Prerequisites"
          image: amazon/aws-cli:2.15.15
          script:
            - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
            - chmod +x kubectl && mv kubectl /usr/local/bin/
            - export TARGET_CLUSTER=${EXISTING_EKS_CLUSTER_NAME:-"my-existing-eks-cluster"}
            - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
            - echo "Connecting to existing cluster $TARGET_CLUSTER in $AWS_REGION..."
            - aws eks update-kubeconfig --region $AWS_REGION --name $TARGET_CLUSTER
            - kubectl get nodes -o wide
            - echo "Applying Gateway API and KubeRay CRDs..."
            - kubectl apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.1.0/standard-install.yaml || true
            - kubectl apply -k "github.com/ray-project/kuberay/ray-operator/config/crd?ref=v1.1.1" || true
            - echo "Applying Secrets Store CSI Driver CRDs and Provider..."
            - kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/main/charts/secrets-store-csi-driver/crds/secrets-store.csi.x-k8s.io_secretproviderclasses.yaml || true
            - kubectl apply -f https://raw.githubusercontent.com/kubernetes-sigs/secrets-store-csi-driver/main/charts/secrets-store-csi-driver/crds/secrets-store.csi.x-k8s.io_secretproviderclasspodstatuses.yaml || true
            - kubectl apply -f https://raw.githubusercontent.com/aws/secrets-store-csi-driver-provider-aws/main/deployment/aws-provider-installer.yaml || true
            - echo "Applying Namespaces, Secrets, IRSA, and Gateway API..."
            - kubectl apply -f k8s/00-namespace.yaml
            - kubectl apply -f k8s/01-secrets.yaml
            - kubectl apply -f k8s/02-irsa-serviceaccount.yaml
            - kubectl apply -f k8s/06-gateway-api.yaml
            - echo "Applying Prometheus & Grafana Monitoring Stack..."
            - kubectl apply -f k8s/07-monitoring.yaml
            - echo "Existing cluster prerequisites and monitoring verified."
      - step: *deploy-rayjob

    # -------------------------------------------------------------------------
    # Custom Option 5: Full End-to-End Pipeline (Terraform -> Health -> RayJob)
    # -------------------------------------------------------------------------
    5-full-end-to-end-deployment:
      - step:
          name: "Deploy Infrastructure via Terraform"
          image: hashicorp/terraform:1.9.4
          script:
            - cd terraform/environments/prod
            - terraform init
            - export EKS_CLUSTER_NAME=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - echo "Syncing pre-existing EKS addons into Terraform state if present..."
            - terraform import module.eks_addons.aws_eks_addon.coredns ${EKS_CLUSTER_NAME}:coredns || true
            - terraform import module.eks_addons.aws_eks_addon.aws_ebs_csi_driver ${EKS_CLUSTER_NAME}:aws-ebs-csi-driver || true
            - terraform import module.eks_addons.aws_eks_addon.aws_secrets_store_csi_driver_provider ${EKS_CLUSTER_NAME}:aws-secrets-store-csi-driver-provider || true
            - terraform import module.eks_addons.aws_eks_addon.metrics_server ${EKS_CLUSTER_NAME}:metrics-server || true
            - terraform apply -auto-approve
      - step:
          name: "Verify Infrastructure Health"
          image: amazon/aws-cli:2.15.15
          script:
            - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
            - export CLUSTER=${EKS_CLUSTER_NAME:-"distributed-ai-eks"}
            - aws eks describe-cluster --name $CLUSTER --region $AWS_REGION --query "cluster.status" || true
      - step: *unit-tests
      - step: *build-and-push
      - step: *check-prerequisites
      - step: *deploy-rayjob

    # -------------------------------------------------------------------------
    # Custom Option 6: Clean Tear-down of Existing RayJob & Immediate Redeployment
    # -------------------------------------------------------------------------
    6-delete-and-redeploy-rayjob:
      - step:
          name: "Clean Tear-Down: Delete Existing RayJob & Reset Worker Pods"
          image: amazon/aws-cli:2.15.15
          script:
            - curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
            - chmod +x kubectl && mv kubectl /usr/local/bin/
            - export TARGET_CLUSTER=${EXISTING_EKS_CLUSTER_NAME:-${EKS_CLUSTER_NAME:-"distributed-ai-eks"}}
            - export AWS_REGION=${AWS_DEFAULT_REGION:-"us-east-1"}
            - echo "Connecting to EKS Cluster $TARGET_CLUSTER in $AWS_REGION..."
            - aws eks update-kubeconfig --region $AWS_REGION --name $TARGET_CLUSTER
            - echo "Deleting existing RayJob resources if present..."
            - kubectl delete rayjob corporate-data-pipeline-job -n kuberay --ignore-not-found=true --timeout=30s || kubectl patch rayjob corporate-data-pipeline-job -n kuberay -p '{"metadata":{"finalizers":[]}}' --type=merge || true
            - echo "Clearing out crashlooping or stuck worker pods..."
            - kubectl delete pod -l ray.io/node-type=worker -n kuberay --ignore-not-found=true
            - kubectl delete pod -l ray.io/node-type=specialized-worker -n kuberay --ignore-not-found=true
            - echo "Existing RayJob deleted and worker pods reset."
      - step: *unit-tests
      - step: *build-and-push
      - step: *check-prerequisites
      - step: *deploy-rayjob

    # -------------------------------------------------------------------------
