# JM Comment: Production GitHub Actions CI/CD Pipeline
# Fulfills assignment requirements:
# 1. Runs a terraform plan on pull requests.
# 2. On merge (push to main), builds a Docker image containing ray_pipeline.py and its dependencies.
# 3. Triggers a RayJob (CRD) on the cluster to execute the pipeline.

name: Distributed AI Foundation CI/CD

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  id-token: write
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Terraform Plan on Pull Requests
  # ---------------------------------------------------------------------------
  terraform-plan:
    name: "Terraform Plan (Pull Request Review)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.4

      - name: Terraform Lint, Init & Plan
        run: |
          cd terraform/environments/prod
          terraform fmt -check -recursive ../.. || true
          terraform init
          terraform plan -no-color

  # ---------------------------------------------------------------------------
  # Stage 2: On Merge to Main -> Build Image & Trigger RayJob CRD
  # ---------------------------------------------------------------------------
  build-and-deploy-rayjob:
    name: "Build Image & Trigger RayJob CRD"
    needs: [terraform-plan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag & Push Container Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: distributed-ai-ray
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG -t $REGISTRY/$REPOSITORY:latest .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
          docker push $REGISTRY/$REPOSITORY:latest

      - name: Set up Kubectl & Connect to EKS
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          aws eks update-kubeconfig --region ${{ secrets.AWS_REGION || 'us-east-1' }} --name ${{ secrets.EKS_CLUSTER_NAME || 'distributed-ai-eks' }}

      - name: Trigger RayJob Custom Resource on EKS
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: distributed-ai-ray
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "Updating RayJob manifest with fresh container image: $REGISTRY/$REPOSITORY:$IMAGE_TAG"
          sed -i "s|693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest|$REGISTRY/$REPOSITORY:$IMAGE_TAG|g" k8s/04-rayjob.yaml
          
          echo "Cleaning any previous completed RayJob instance..."
          kubectl delete rayjob corporate-data-pipeline-job -n kuberay --ignore-not-found=true --timeout=30s || true
          
          echo "Applying RayJob CRD to EKS..."
          kubectl apply -f k8s/04-rayjob.yaml
          
          echo "Verifying RayJob deployment..."
          kubectl get rayjob corporate-data-pipeline-job -n kuberay
