# JM Comment: Comprehensive Prometheus & Grafana Monitoring Stack for Distributed AI Ray Platform
# Scrapes: Ray Head/Worker cluster metrics, task-level execution stats, actor states, Plasma object store, and EKS node metrics.
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    app.kubernetes.io/name: monitoring
    app.kubernetes.io/part-of: distributed-ai-platform
---
# ServiceAccount for Prometheus RBAC discovery
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prometheus-k8s
  namespace: monitoring
---
# ClusterRole granting Prometheus permissions to discover nodes, pods, and metrics
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: prometheus-k8s
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - services
      - endpoints
      - pods
    verbs: ["get", "list", "watch"]
  - apiGroups: ["extensions", "networking.k8s.io"]
    resources:
      - ingresses
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["/metrics", "/metrics/cadvisor"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: prometheus-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: prometheus-k8s
subjects:
  - kind: ServiceAccount
    name: prometheus-k8s
    namespace: monitoring
---
# Prometheus Server Configuration for Ray Cluster, Node, and Task-Level Scraping
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-server-conf
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s

    scrape_configs:
      # 1. JM Comment: Ray Cluster, Task, and Actor Metrics (Port 44217 on Head & Workers)
      - job_name: 'ray-cluster-metrics'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
            action: keep
            regex: true
          - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
            action: replace
            target_label: __metrics_path__
            regex: (.+)
          - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
            action: replace
            regex: ([^:]+)(?::\d+)?;(\d+)
            replacement: $1:$2
            target_label: __address__
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_ray_io_node_type]
            action: replace
            target_label: ray_node_type
          - source_labels: [__meta_kubernetes_pod_label_ray_io_cluster]
            action: replace
            target_label: ray_cluster

      # Fallback discovery directly matching kuberay pods on port 44217
      - job_name: 'kuberay-pods-direct'
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - kuberay
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            action: keep
            regex: "44217|8265"
          - source_labels: [__meta_kubernetes_namespace]
            action: replace
            target_label: kubernetes_namespace
          - source_labels: [__meta_kubernetes_pod_name]
            action: replace
            target_label: kubernetes_pod_name
          - source_labels: [__meta_kubernetes_pod_label_ray_io_node_type]
            action: replace
            target_label: ray_node_type

      # 2. JM Comment: Node-Level Hardware Metrics (CPU, Memory, Filesystem)
      - job_name: 'kubernetes-nodes'
        scheme: https
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)

      # 3. JM Comment: Task and Container-Level cAdvisor Metrics (Per-container CPU/Memory)
      - job_name: 'kubernetes-cadvisor'
        scheme: https
        metrics_path: /metrics/cadvisor
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
          insecure_skip_verify: true
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - action: labelmap
            regex: __meta_kubernetes_node_label_(.+)
---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus-server
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus-server
    spec:
      serviceAccountName: prometheus-k8s
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.console.libraries=/usr/share/prometheus/console_libraries"
            - "--web.console.templates=/usr/share/prometheus/consoles"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
              name: web
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1024Mi
          volumeMounts:
            - name: config-volume
              mountPath: /etc/prometheus
            - name: storage-volume
              mountPath: /prometheus
      volumes:
        - name: config-volume
          configMap:
            name: prometheus-server-conf
        - name: storage-volume
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
spec:
  type: ClusterIP
  ports:
    - port: 9090
      targetPort: 9090
      name: web
  selector:
    app.kubernetes.io/name: prometheus-server
---
# Grafana Datasource Configuration (Points to Prometheus)
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: monitoring
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
---
# Grafana Dashboard Provider Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: monitoring
data:
  provider.yaml: |
    apiVersion: 1
    providers:
      - name: 'RayDashboards'
        orgId: 1
        folder: 'Distributed AI'
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
# Pre-loaded Grafana Dashboard for Ray Cluster, Node & Task-Level Metrics
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-ray-dashboard
  namespace: monitoring
data:
  ray-cluster-dashboard.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 0,
      "id": null,
      "links": [],
      "liveNow": false,
      "panels": [
        {
          "title": "Ray Active Nodes",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 0 },
          "targets": [
            {
              "expr": "count(count by (instance) (ray_node_cpu_utilization)) or count(kube_pod_info{namespace=\"kuberay\"})",
              "legendFormat": "Active Nodes",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Tasks Status (Executing / Waiting / Dispatched)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 6, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_scheduler_tasks) by (State) or vector(0)",
              "legendFormat": "{{State}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Active Workers & Actors",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 12, "y": 0 },
          "targets": [
            {
              "expr": "count(count by (ip) (ray_node_cpu_utilization)) or count(kube_pod_info{namespace=\"kuberay\"})",
              "legendFormat": "Active Instances",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Plasma Object Store Memory Used (Bytes)",
          "type": "stat",
          "gridPos": { "h": 4, "w": 6, "x": 18, "y": 0 },
          "targets": [
            {
              "expr": "sum(ray_object_store_used_memory) or vector(0)",
              "legendFormat": "Used Plasma (Bytes)",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Cluster CPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 4 },
          "targets": [
            {
              "expr": "ray_node_cpu_utilization",
              "legendFormat": "{{instance}} CPU %",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Node Memory Consumption (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 4 },
          "targets": [
            {
              "expr": "ray_node_mem_used / ray_node_mem_total * 100",
              "legendFormat": "{{instance}} RAM %",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Task & Pod Container CPU Usage (cAdvisor)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 12 },
          "targets": [
            {
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"kuberay\",container!=\"\"}[2m])) by (pod, container)",
              "legendFormat": "{{pod}} ({{container}})",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Task & Pod Container Working Set Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 12 },
          "targets": [
            {
              "expr": "sum(container_memory_working_set_bytes{namespace=\"kuberay\",container!=\"\"}) by (pod, container)",
              "legendFormat": "{{pod}} ({{container}})",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Task Execution & Scheduling States (Executing / Waiting / Dispatched)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 20 },
          "targets": [
            {
              "expr": "sum(ray_scheduler_tasks) by (State)",
              "legendFormat": "Task State: {{State}}",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Plasma Object Store Memory: Capacity vs Used vs Free (MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 20 },
          "targets": [
            {
              "expr": "sum(ray_object_store_memory) / 1048576",
              "legendFormat": "Total Object Store Capacity (MB)",
              "refId": "A"
            },
            {
              "expr": "sum(ray_object_store_used_memory) / 1048576",
              "legendFormat": "Used Plasma Memory (MB)",
              "refId": "B"
            },
            {
              "expr": "sum(ray_object_store_available_memory) / 1048576",
              "legendFormat": "Available Free Plasma (MB)",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Plasma Object Spilling to Local NVMe & S3 (MB / Objects)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 28 },
          "targets": [
            {
              "expr": "sum(ray_spill_manager_objects_bytes) / 1048576",
              "legendFormat": "Spilled Data (MB)",
              "refId": "A"
            },
            {
              "expr": "sum(ray_spill_manager_objects)",
              "legendFormat": "Spilled Objects Count",
              "refId": "B"
            },
            {
              "expr": "sum(ray_spill_manager_request_total)",
              "legendFormat": "Spill Requests",
              "refId": "C"
            }
          ]
        },
        {
          "title": "Ray Internal Component Memory Footprint (RSS MB)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 28 },
          "targets": [
            {
              "expr": "sum(ray_component_rss_mb) by (Component)",
              "legendFormat": "{{Component}} RSS MB",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Ray Internal Component CPU Utilization (%)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 36 },
          "targets": [
            {
              "expr": "sum(ray_component_cpu_percentage) by (Component)",
              "legendFormat": "{{Component}} CPU %",
              "refId": "A"
            }
          ]
        },
        {
          "title": "Scheduling Health & Worker Startup Diagnostics",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 36 },
          "targets": [
            {
              "expr": "sum(ray_scheduler_unscheduleable_tasks)",
              "legendFormat": "Unschedulable Tasks (Pending Nodes)",
              "refId": "A"
            },
            {
              "expr": "sum(ray_scheduler_failed_worker_startup_total)",
              "legendFormat": "Failed Worker Startups",
              "refId": "B"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "title": "Ray Distributed AI Cluster & Task Metrics",
      "uid": "ray-cluster-metrics"
    }
---
# Grafana Deployment (Latest Grafana v11 with Preconfigured Prometheus Datasource & Dashboards)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.2.0
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "admin"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "admin"
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: "true"
            - name: GF_AUTH_ANONYMOUS_ORG_ROLE
              value: "Viewer"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: dashboard-provider
              mountPath: /etc/grafana/provisioning/dashboards
            - name: dashboards
              mountPath: /var/lib/grafana/dashboards/ray-cluster-metrics.json
              subPath: ray-cluster-dashboard.json
            - name: dashboards-default
              mountPath: /var/lib/grafana/dashboards/default_grafana_dashboard.json
              subPath: default_grafana_dashboard.json
            - name: dashboards-data
              mountPath: /var/lib/grafana/dashboards/data_grafana_dashboard.json
              subPath: data_grafana_dashboard.json
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: dashboard-provider
          configMap:
            name: grafana-dashboard-provider
        - name: dashboards
          configMap:
            name: grafana-ray-dashboard
        - name: dashboards-default
          configMap:
            name: ray-default-dashboard
        - name: dashboards-data
          configMap:
            name: ray-data-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  selector:
    app.kubernetes.io/name: grafana
