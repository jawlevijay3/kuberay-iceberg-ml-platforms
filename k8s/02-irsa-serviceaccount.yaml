# JM Comment: Zero-Trust IRSA Service Accounts for Ray Head and Ray Worker Pods
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-worker-sa
  namespace: kuberay
  annotations:
    # JM Comment: AWS IRSA annotation binding K8s ServiceAccount to scoped AWS IAM Role
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/distributed-ai-eks-ray-pod-irsa-role"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ray-head-sa
  namespace: kuberay
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/distributed-ai-eks-ray-pod-irsa-role"
---
# JM Comment: Least-privilege RBAC role for cluster discovery
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ray-cluster-role
  namespace: kuberay
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["ray.io"]
    resources: ["rayclusters", "rayjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ray-cluster-rolebinding
  namespace: kuberay
subjects:
  - kind: ServiceAccount
    name: ray-worker-sa
    namespace: kuberay
  - kind: ServiceAccount
    name: ray-head-sa
    namespace: kuberay
roleRef:
  kind: Role
  name: ray-cluster-role
  apiGroup: rbac.authorization.k8s.io
