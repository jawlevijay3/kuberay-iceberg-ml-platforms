# JM Comment: Production RayCluster CRD with Head, General Spot Workers, and Bottlerocket Resolver Workers
# Sized conservatively to fit within EKS node allocatable capacity (including init containers & system overhead)
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: corporate-ai-cluster
  namespace: kuberay
  labels:
    app.kubernetes.io/name: kuberay
    ray.io/cluster: corporate-ai-cluster
spec:
  rayVersion: '2.35.0'
  # -----------------------------------------------------------------------
  # Head Node: Dedicated to GCS & Orchestration (Pinned to On-Demand Pool)
  # -----------------------------------------------------------------------
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      metrics-export-port: '44217'
      num-cpus: '0'
      block: 'true'
    template:
      metadata:
        labels:
          ray.io/node-type: head
        annotations:
          prometheus.io/scrape: "true"
          prometheus.io/port: "44217"
          prometheus.io/path: "/metrics"
      spec:
        serviceAccountName: ray-head-sa
        nodeSelector:
          ray-node-type: head
          workload: system
        containers:
          - name: ray-head
            image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
            imagePullPolicy: IfNotPresent
            resources:
              limits:
                cpu: '1500m'
                memory: '3Gi'
              requests:
                cpu: '500m'
                memory: '1500Mi'
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
            livenessProbe:
              exec:
                command:
                  - bash
                  - -c
                  - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://localhost:8265/api/gcs_healthz | grep success
              initialDelaySeconds: 30
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 120
            readinessProbe:
              exec:
                command:
                  - bash
                  - -c
                  - wget -T 2 -q -O- http://localhost:52365/api/local_raylet_healthz | grep success && wget -T 2 -q -O- http://localhost:8265/api/gcs_healthz | grep success
              initialDelaySeconds: 15
              periodSeconds: 10
              timeoutSeconds: 5
              failureThreshold: 10
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
              - containerPort: 44217
                name: metrics
            env:
              - name: RAY_GRAFANA_HOST
                value: "http://grafana.monitoring.svc.cluster.local:3000"
              - name: RAY_PROMETHEUS_HOST
                value: "http://prometheus.monitoring.svc.cluster.local:9090"
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi

  # -----------------------------------------------------------------------
  # Worker Groups: General Spot Workers & Bottlerocket Resolver (with Secrets Store CSI Driver)
  # -----------------------------------------------------------------------
  workerGroupSpecs:
    # Worker Group 1: General Spot Workers (Parallel Ingestion & Data Tasks)
    - groupName: general-spot-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 8
      rayStartParams:
        metrics-export-port: '44217'
        object-store-memory: '2147483648' # 2 GiB Plasma Object Store
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: worker
            workload: general
            lifecycle: Ec2Spot
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "44217"
            prometheus.io/path: "/metrics"
        spec:
          securityContext:
            fsGroup: 100
          serviceAccountName: ray-worker-sa
          nodeSelector:
            ray-node-type: worker
            workload: general
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "ray-worker"
              effect: "NoSchedule"
          containers:
            - name: ray-worker
              image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '1500m'
                  memory: '6Gi'
                requests:
                  cpu: '800m'
                  memory: '3Gi'
              ports:
                - containerPort: 44217
                  name: metrics
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /tmp/ray
                  name: ray-spill-storage
              env:
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
                - name: ICEBERG_S3_BUCKET
                  value: "distributed-ai-lake-d14ec094"
                - name: GLUE_DATABASE_NAME
                  value: "corporate_iceberg_db"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
            - name: ray-spill-storage
              emptyDir: {}

    # Worker Group 2: Bottlerocket Specialized Resolver Workers (2 CPU, 16 GB RAM)
    - groupName: specialized-resolver-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 4
      rayStartParams:
        metrics-export-port: '44217'
        resources: '"{\"actor_node\": 1}"'
        object-store-memory: '2147483648' # 2 GiB
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: specialized-worker
            workload: entity-resolver
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "44217"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: ray-worker-sa
          nodeSelector:
            ray-node-type: specialized-worker
            workload: entity-resolver
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "entity-resolver"
              effect: "NoSchedule"
          containers:
            - name: ray-resolver-worker
              image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '1500m'
                  memory: '8Gi'
                requests:
                  cpu: '800m'
                  memory: '4Gi'
              ports:
                - containerPort: 44217
                  name: metrics
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /mnt/secrets-store
                  name: secrets-store-inline
                  readOnly: true
              env:
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 2Gi
            - name: secrets-store-inline
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: "ray-aws-secrets"
