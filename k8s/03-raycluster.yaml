# JM Comment: Production RayCluster CRD with Head, General Spot Workers, and Bottlerocket Resolver Workers
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: corporate-ai-cluster
  namespace: kuberay
  labels:
    app.kubernetes.io/name: kuberay
    ray.io/cluster: corporate-ai-cluster
spec:
  rayVersion: '2.35.0'
  # -----------------------------------------------------------------------
  # Head Node: Dedicated to GCS & Orchestration (Pinned to On-Demand Pool)
  # -----------------------------------------------------------------------
  headGroupSpec:
    serviceAccountName: ray-head-sa
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0' # Dedicated to cluster coordination; zero user tasks
      block: 'true'
    template:
      metadata:
        labels:
          ray.io/node-type: head
      spec:
        nodeSelector:
          ray-node-type: head
          workload: system
        containers:
          - name: ray-head
            image: rayproject/ray:2.35.0-py310
            imagePullPolicy: IfNotPresent
            resources:
              limits:
                cpu: '2'
                memory: '4Gi'
              requests:
                cpu: '1'
                memory: '2Gi'
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi

  # -----------------------------------------------------------------------
  # Worker Groups: Decoupled into General Spot Workers & Bottlerocket Resolver
  # -----------------------------------------------------------------------
  workerGroupSpecs:
    # Worker Group 1: General Spot Workers (Parallel Ingestion & Data Tasks)
    - groupName: general-spot-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 8
      serviceAccountName: ray-worker-sa
      rayStartParams:
        object-store-memory: '3221225472' # 3 GiB Plasma Object Store
        # JM Comment: Explicit object spilling configuration to disk/S3
        system-config: '{"object_spilling_config":"{\"type\":\"filesystem\",\"params\":{\"directory\":\"/tmp/ray/spill\"}}"}'
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: worker
            workload: general
            lifecycle: Ec2Spot
        spec:
          nodeSelector:
            ray-node-type: worker
            workload: general
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "ray-worker"
              effect: "NoSchedule"
          containers:
            - name: ray-worker
              image: rayproject/ray:2.35.0-py310
              imagePullPolicy: IfNotPresent
              lifecycle:
                # JM Comment: Graceful drain giving 60 seconds to finish tasks and spill objects
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '2'
                  memory: '8Gi'
                requests:
                  cpu: '1500m'
                  memory: '6Gi'
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /tmp/ray/spill
                  name: ray-spill-storage
              env:
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
                - name: ICEBERG_S3_BUCKET
                  value: "distributed-ai-lake"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 4Gi
            - name: ray-spill-storage
              emptyDir: {}

    # Worker Group 2: Bottlerocket Specialized Resolver Workers (2 CPU, 16 GB RAM)
    # JM Comment: Dedicated Bottlerocket node pool hosting EntityResolver actor
    - groupName: specialized-resolver-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 4
      serviceAccountName: ray-worker-sa
      rayStartParams:
        # JM Comment: Custom Ray resource 'actor_node: 1' enables strict actor affinity
        resources: '"{\"actor_node\": 1}"'
        object-store-memory: '4294967296' # 4 GiB Object Store
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: specialized-worker
            workload: entity-resolver
        spec:
          nodeSelector:
            ray-node-type: specialized-worker
            workload: entity-resolver
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "entity-resolver"
              effect: "NoSchedule"
          containers:
            - name: ray-resolver-worker
              image: rayproject/ray:2.35.0-py310
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '2'
                  memory: '14Gi'
                requests:
                  cpu: '1800m'
                  memory: '10Gi'
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
              env:
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ray-llm-secret
                      key: LLM_API_KEY
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 6Gi
