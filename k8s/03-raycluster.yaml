# JM Comment: Production RayCluster CRD with Head, General Spot Workers, and Bottlerocket Resolver Workers
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: corporate-ai-cluster
  namespace: kuberay
  labels:
    app.kubernetes.io/name: kuberay
    ray.io/cluster: corporate-ai-cluster
spec:
  rayVersion: '2.35.0'
  # -----------------------------------------------------------------------
  # Head Node: Dedicated to GCS & Orchestration (Pinned to On-Demand Pool)
  # -----------------------------------------------------------------------
  headGroupSpec:
    rayStartParams:
      dashboard-host: '0.0.0.0'
      num-cpus: '0'
      block: 'true'
    template:
      metadata:
        labels:
          ray.io/node-type: head
      spec:
        serviceAccountName: ray-head-sa
        nodeSelector:
          ray-node-type: head
          workload: system
        containers:
          - name: ray-head
            image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
            imagePullPolicy: IfNotPresent
            resources:
              limits:
                cpu: '2'
                memory: '4Gi'
              requests:
                cpu: '1'
                memory: '2Gi'
            volumeMounts:
              - mountPath: /dev/shm
                name: dshm
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
              - containerPort: 10001
                name: client
        volumes:
          - name: dshm
            emptyDir:
              medium: Memory
              sizeLimit: 2Gi

  # -----------------------------------------------------------------------
  # Worker Groups: General Spot Workers & Bottlerocket Resolver (with Secrets Store CSI Driver)
  # -----------------------------------------------------------------------
  workerGroupSpecs:
    # Worker Group 1: General Spot Workers (Parallel Ingestion & Data Tasks)
    - groupName: general-spot-workers
      replicas: 2
      minReplicas: 1
      maxReplicas: 8
      rayStartParams:
        object-store-memory: '3221225472' # 3 GiB Plasma Object Store
        system-config: '{"object_spilling_config":"{\"type\":\"filesystem\",\"params\":{\"directory\":\"/tmp/ray/spill\"}}"}'
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: worker
            workload: general
            lifecycle: Ec2Spot
        spec:
          serviceAccountName: ray-worker-sa
          nodeSelector:
            ray-node-type: worker
            workload: general
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "ray-worker"
              effect: "NoSchedule"
          containers:
            - name: ray-worker
              image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '2'
                  memory: '8Gi'
                requests:
                  cpu: '1500m'
                  memory: '6Gi'
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                - mountPath: /tmp/ray/spill
                  name: ray-spill-storage
              env:
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
                - name: ICEBERG_S3_BUCKET
                  value: "distributed-ai-lake"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 4Gi
            - name: ray-spill-storage
              emptyDir: {}

    # Worker Group 2: Bottlerocket Specialized Resolver Workers (2 CPU, 16 GB RAM)
    # JM Comment: Pinned to Bottlerocket node pool with Secrets Store CSI Driver volume mount
    - groupName: specialized-resolver-workers
      replicas: 1
      minReplicas: 1
      maxReplicas: 4
      rayStartParams:
        resources: '"{\"actor_node\": 1}"'
        object-store-memory: '4294967296'
        block: 'true'
      template:
        metadata:
          labels:
            ray.io/node-type: specialized-worker
            workload: entity-resolver
        spec:
          serviceAccountName: ray-worker-sa
          nodeSelector:
            ray-node-type: specialized-worker
            workload: entity-resolver
          tolerations:
            - key: "dedicated"
              operator: "Equal"
              value: "entity-resolver"
              effect: "NoSchedule"
          containers:
            - name: ray-resolver-worker
              image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
              imagePullPolicy: IfNotPresent
              lifecycle:
                preStop:
                  exec:
                    command: ["/bin/sh", "-c", "ray stop --grace-period 60"]
              resources:
                limits:
                  cpu: '2'
                  memory: '14Gi'
                requests:
                  cpu: '1800m'
                  memory: '10Gi'
              volumeMounts:
                - mountPath: /dev/shm
                  name: dshm
                # JM Comment: Mount path for AWS Secrets Store CSI Driver
                - mountPath: /mnt/secrets-store
                  name: secrets-store-inline
                  readOnly: true
              env:
                - name: LLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: ray-llm-secret
                      key: LLM_API_KEY
                - name: ICEBERG_CATALOG_TYPE
                  value: "glue"
          volumes:
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 6Gi
            # JM Comment: CSI volume reading from SecretProviderClass ray-aws-secrets
            - name: secrets-store-inline
              csi:
                driver: secrets-store.csi.k8s.io
                readOnly: true
                volumeAttributes:
                  secretProviderClass: "ray-aws-secrets"
