# JM Comment: Centralized Log Aggregation via Fluent Bit DaemonSet
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluent-bit-ray-config
  namespace: kuberay
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         1
        Log_Level     info
        Daemon        off
        Parsers_File  parsers.conf

    # JM Comment: Tail container logs from Ray Head and Worker Pods
    [INPUT]
        Name              tail
        Tag               kube.kuberay.*
        Path              /var/log/containers/*kuberay*.log
        Parser            docker
        DB                /var/log/flb_kube_ray.db
        Mem_Buf_Limit     50MB
        Skip_Long_Lines   On
        Refresh_Interval  5

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Kube_Tag_Prefix     kube.kuberay.var.log.containers.
        Merge_Log           On
        Keep_Log            Off

    # Ship structured logs to AWS CloudWatch Logs or Grafana Loki
    [OUTPUT]
        Name                cloudwatch_logs
        Match               kube.kuberay.*
        region              us-east-1
        log_group_name      /aws/ray/corporate-pipeline
        log_stream_prefix   ray-pod-
        auto_create_group   true

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit-ray
  namespace: kuberay
spec:
  selector:
    matchLabels:
      app: fluent-bit-ray
  template:
    metadata:
      labels:
        app: fluent-bit-ray
    spec:
      serviceAccountName: ray-worker-sa
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "ray-worker"
          effect: "NoSchedule"
      containers:
        - name: fluent-bit
          image: amazon/aws-for-fluent-bit:latest
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: config-volume
              mountPath: /fluent-bit/etc/
          resources:
            limits:
              memory: 200Mi
            requests:
              cpu: 100m
              memory: 100Mi
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: config-volume
          configMap:
            name: fluent-bit-ray-config
