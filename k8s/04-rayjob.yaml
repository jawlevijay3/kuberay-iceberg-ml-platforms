# JM Comment: RayJob Custom Resource Definition to execute batch ETL & ML Pipeline
# Sized conservatively to fit within EKS worker node allocatable capacity
apiVersion: ray.io/v1
kind: RayJob
metadata:
  name: corporate-data-pipeline-job
  namespace: kuberay
  labels:
    app.kubernetes.io/name: rayjob
    job-type: corporate-harmonization
spec:
  # Triggers pipeline script inside container
  entrypoint: python3 /home/ray/app/ray_pipeline.py
  
  # Reference existing cluster or embed transient cluster
  clusterSelector:
    ray.io/cluster: corporate-ai-cluster

  # Cleanup policy after execution
  shutdownAfterJobFinishes: false
  ttlSecondsAfterFinished: 86400 # Retain pod logs for 24 hours for debugging

  # JM Comment: Submitter pod runs python ray_pipeline.py and requires IRSA for AWS Glue & S3 permissions
  submitterPodTemplate:
    spec:
      serviceAccountName: ray-head-sa
      restartPolicy: Never
      containers:
        - name: ray-job-submitter
          image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
          imagePullPolicy: Always
          env:
            - name: AWS_DEFAULT_REGION
              value: "us-east-1"
            - name: AWS_REGION
              value: "us-east-1"
            - name: ICEBERG_CATALOG_TYPE
              value: "glue"
            - name: ICEBERG_S3_BUCKET
              value: "distributed-ai-lake-693880751318"
            - name: GLUE_DATABASE_NAME
              value: "corporate_iceberg_db"
            - name: MODEL_S3_BUCKET
              value: "distributed-ai-models-693880751318"
            - name: PYTHONUNBUFFERED
              value: "1"
          resources:
            requests:
              cpu: "300m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"

  runtimeEnvYAML: |
    env_vars:
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_REGION: "us-east-1"
      ICEBERG_CATALOG_TYPE: "glue"
      ICEBERG_S3_BUCKET: "distributed-ai-lake-693880751318"
      MODEL_S3_BUCKET: "distributed-ai-models-693880751318"
      GLUE_DATABASE_NAME: "corporate_iceberg_db"
      PYTHONUNBUFFERED: "1"

  # Fallback: if running standalone, RayJob provisions ephemeral cluster using rayClusterSpec
  rayClusterSpec:
    rayVersion: '2.35.0'
    headGroupSpec:
      rayStartParams:
        dashboard-host: '0.0.0.0'
        metrics-export-port: '44217'
        num-cpus: '0'
      template:
        metadata:
          annotations:
            prometheus.io/scrape: "true"
            prometheus.io/port: "44217"
            prometheus.io/path: "/metrics"
        spec:
          serviceAccountName: ray-head-sa
          nodeSelector:
            ray-node-type: head
          containers:
            - name: ray-head
              image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
              ports:
                - containerPort: 6379
                  name: gcs
                - containerPort: 8265
                  name: dashboard
                - containerPort: 10001
                  name: client
                - containerPort: 44217
                  name: metrics
              resources:
                limits:
                  cpu: '1500m'
                  memory: '3Gi'
                requests:
                  cpu: '500m'
                  memory: '1500Mi'
    workerGroupSpecs:
      - groupName: spot-workers
        replicas: 2
        minReplicas: 1
        maxReplicas: 8
        rayStartParams:
          metrics-export-port: '44217'
          resources: '"{\"actor_node\": 1}"'
        template:
          metadata:
            annotations:
              prometheus.io/scrape: "true"
              prometheus.io/port: "44217"
              prometheus.io/path: "/metrics"
          spec:
            serviceAccountName: ray-worker-sa
            nodeSelector:
              ray-node-type: worker
            tolerations:
              - key: "dedicated"
                operator: "Equal"
                value: "ray-worker"
                effect: "NoSchedule"
            containers:
              - name: ray-worker
                image: 693880751318.dkr.ecr.us-east-1.amazonaws.com/distributed-ai-ray:latest
                ports:
                  - containerPort: 44217
                    name: metrics
                resources:
                  limits:
                    cpu: '1500m'
                    memory: '6Gi'
                  requests:
                    cpu: '800m'
                    memory: '3Gi'
                volumeMounts:
                  - mountPath: /mnt/secrets-store
                    name: secrets-store-inline
                    readOnly: true
            volumes:
              - name: secrets-store-inline
                csi:
                  driver: secrets-store.csi.k8s.io
                  readOnly: true
                  volumeAttributes:
                    secretProviderClass: "ray-aws-secrets"

