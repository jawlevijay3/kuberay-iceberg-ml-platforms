# JM Comment: EnvoyProxy Custom Resource to configure AWS Load Balancer for the Gateway API Proxy
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: ray-gateway-proxy-config
  namespace: kuberay
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyService:
        type: LoadBalancer
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: "external"
          service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
          service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
---
# JM Comment: Kubernetes Gateway API Specification for Ray, Grafana, and Prometheus Routing
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: ray-gateway-class
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  description: "Ray and Observability Gateway"
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: ray-gateway-proxy-config
    namespace: kuberay
---
# JM Comment: Gateway resource exposing Ray, Grafana, and Prometheus with modern L7 routing and AWS Load Balancer
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ray-dashboard-gateway
  namespace: kuberay
  annotations:
    gateway.networking.k8s.io/service-type: LoadBalancer
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-attributes: "load_balancing.cross_zone.enabled=true"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
spec:
  gatewayClassName: ray-gateway-class
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ray-dashboard-tls
      allowedRoutes:
        namespaces:
          from: All
---
# ReferenceGrant in monitoring namespace allowing Gateway in kuberay to route to monitoring services
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-kuberay-gateway
  namespace: monitoring
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: kuberay
  to:
    - group: ""
      kind: Service
---
# 1. Ray Head Dashboard HTTPRoute (Host-based and default fallback)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ray-dashboard-route
  namespace: kuberay
spec:
  parentRefs:
    - name: ray-dashboard-gateway
      namespace: kuberay
  hostnames:
    - "ray.corporate-ai.internal"
    - "ray.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: corporate-ai-cluster-head-svc
          port: 8265
          weight: 100
---
# Default Fallback Route (when accessed directly via ELB DNS or IP)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ray-default-route
  namespace: kuberay
spec:
  parentRefs:
    - name: ray-dashboard-gateway
      namespace: kuberay
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: corporate-ai-cluster-head-svc
          port: 8265
          weight: 100
---
# 2. Grafana Dashboard HTTPRoute (Host-based)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: monitoring
spec:
  parentRefs:
    - name: ray-dashboard-gateway
      namespace: kuberay
  hostnames:
    - "grafana.corporate-ai.internal"
    - "grafana.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000
          weight: 100
---
# 3. Prometheus Server UI HTTPRoute (Host-based)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prometheus-route
  namespace: monitoring
spec:
  parentRefs:
    - name: ray-dashboard-gateway
      namespace: kuberay
  hostnames:
    - "prometheus.corporate-ai.internal"
    - "prometheus.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: prometheus
          port: 9090
          weight: 100
