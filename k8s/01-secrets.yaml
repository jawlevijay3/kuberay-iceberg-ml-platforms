# JM Comment: Zero-Trust Secret Management via External Secrets Operator (ESO)
# Synchronizes LLM_API_KEY from AWS Secrets Manager dynamically at runtime
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager-store
  namespace: kuberay
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: ray-worker-sa
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ray-llm-external-secret
  namespace: kuberay
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager-store
    kind: SecretStore
  target:
    name: ray-llm-secret
    creationPolicy: Owner
  data:
    - secretKey: LLM_API_KEY
      remoteRef:
        key: "distributed-ai/llm-api-key"
        property: "api_key"
---
# JM Comment: Sandbox fallback secret for local dry-runs and non-production testing
apiVersion: v1
kind: Secret
metadata:
  name: ray-llm-secret-fallback
  namespace: kuberay
  labels:
    app.kubernetes.io/component: ray-pipeline
type: Opaque
stringData:
  LLM_API_KEY: "sk-enterprise-sandbox-token-v2"
