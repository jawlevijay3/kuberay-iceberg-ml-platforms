# JM Comment: SecretProviderClass for AWS Secrets Store CSI Driver
# Mounts LLM_API_KEY from AWS Secrets Manager and synchronizes it into K8s Secret ray-llm-secret
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: ray-aws-secrets
  namespace: kuberay
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "distributed-ai/llm-api-key"
        objectType: "secretsmanager"
        jmesPath:
          - path: "api_key"
            objectAlias: "LLM_API_KEY"
  # JM Comment: Synchronizes mounted AWS secret into a standard K8s Secret for container env injection
  secretObjects:
    - secretName: ray-llm-secret
      type: Opaque
      data:
        - objectName: "LLM_API_KEY"
          key: LLM_API_KEY
---
# JM Comment: Local sandbox fallback secret for non-cloud testing
apiVersion: v1
kind: Secret
metadata:
  name: ray-llm-secret
  namespace: kuberay
  labels:
    app.kubernetes.io/component: ray-pipeline
type: Opaque
stringData:
  LLM_API_KEY: "sk-enterprise-token-csi-v1"
